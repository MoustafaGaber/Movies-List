<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>


<h1 class="sign">Sign-Up For Movie List</h1>

<center>    
    <form  id="signupForm" class="form">
<div class="name-div">
<input type="text" name="username" placeholder="Username" required class="email" />
</div>
<div class="email-div">
<input type="email" required placeholder="Email" class="email">
</div>
<div class="password-div">
  <input type="password" name="password" placeholder="Password" class="email" required />
  </div>
<div class="submit-div">
<button class="submit" type="submit">Sign-Up</button>
</div>
</form></center>










<script src="sign-up.js"></script>
</body>
</html>
